<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number guessing game | HTML CSS JavaScript Practical</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--accent:#4f46e5;--border:#e2e8f0}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#111827,#312e81);color:white;padding:24px 6%} header h1{margin:0 0 6px;font-size:clamp(1.4rem,3vw,2.2rem)} header p{margin:0;color:#dbeafe}
main{max-width:1100px;margin:28px auto;padding:0 20px} .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:0 8px 30px #0f172a0d;margin-bottom:20px}
.demo{border:1px dashed #94a3b8;border-radius:14px;padding:22px;background:#f8fafc} button,.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
input,select,textarea{padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin:4px} table{border-collapse:collapse;width:100%} th,td{border:1px solid #cbd5e1;padding:9px;text-align:left}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px} .muted{color:var(--muted)} code,pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;overflow:auto}
</style>
</head>
<body>
<header><h1>Number guessing game</h1><p>Number guessing game</p></header>
<main>
<section class="card"><div class="demo"><input id="g" type="number" min="1" max="10" placeholder="1-10"><button onclick="guess()">Guess</button><p id="out"></p></div>
<script>const secret=Math.floor(Math.random()*10)+1;function guess(){const g=+document.getElementById('g').value;document.getElementById('out').textContent=g===secret?'Correct! 🎉':g<secret?'Try higher.':'Try lower.'}</script></section>
<nav><a class="btn" href="../../index.html">Home</a><a class="btn" href="index.html">Back to Programs</a></nav>
</main>
</body>
</html>
